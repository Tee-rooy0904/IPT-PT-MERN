<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        h1, p {
            color: #333;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        p {
            margin-bottom: 30px;
            opacity: 0.9;
        }
        label {
            display: block;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffffff;
            color: #333;
            border: 1px solid #cccccc;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-size: 16px;
            box-sizing: border-box;
        }
        .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
        .name-fields {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .name-field {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 14px 0;
            border-radius: 40px;
            font-size: 18px;
            border: none;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .login-link {
            text-align: center;
            color: #333;
            font-weight: 500;
            margin-top: 20px;
        }
        .login-link a {
            color: #4facfe;
            margin-left: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        input.error-field {
            border: 1px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Create Your Account</h1>
        <p>Sign up to access all features</p>
        
        <form id="registrationForm">
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a username">
                <div id="usernameError" class="error">Username is required</div>
            </div>
            
            <div class="name-fields">
                <div class="name-field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Your first name">
                    <div id="firstNameError" class="error">First name is required</div>
                </div>
                
                <div class="name-field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Your last name">
                    <div id="lastNameError" class="error">Last name is required</div>
                </div>
            </div>
            
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your email address">
                <div id="emailError" class="error">Email is required</div>
            </div>
            
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a secure password">
                <div id="passwordError" class="error">Password must be at least 6 characters</div>
            </div>
            
            <div>
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
                <div id="confirmPasswordError" class="error">Passwords do not match</div>
            </div>
            
            <button type="submit" id="submitButton">Register Now</button>
            
            <div class="login-link">
                Already have an account? <a href="#" id="loginLink">Sign In</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset errors
            const errorElements = document.querySelectorAll('.error');
            errorElements.forEach(el => el.style.display = 'none');
            
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => input.classList.remove('error-field'));
            
            // Get form data
            const username = document.getElementById('username').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            let isValid = true;
            
            // Validate username
            if (!username) {
                document.getElementById('usernameError').style.display = 'block';
                document.getElementById('username').classList.add('error-field');
                isValid = false;
            }
            
            // Validate firstName
            if (!firstName) {
                document.getElementById('firstNameError').style.display = 'block';
                document.getElementById('firstName').classList.add('error-field');
                isValid = false;
            }
            
            // Validate lastName
            if (!lastName) {
                document.getElementById('lastNameError').style.display = 'block';
                document.getElementById('lastName').classList.add('error-field');
                isValid = false;
            }
            
            // Validate email
            if (!email) {
                document.getElementById('emailError').textContent = 'Email is required';
                document.getElementById('emailError').style.display = 'block';
                document.getElementById('email').classList.add('error-field');
                isValid = false;
            } else if (!/\S+@\S+\.\S+/.test(email)) {
                document.getElementById('emailError').textContent = 'Email is invalid';
                document.getElementById('emailError').style.display = 'block';
                document.getElementById('email').classList.add('error-field');
                isValid = false;
            }
            
            // Validate password
            if (!password) {
                document.getElementById('passwordError').textContent = 'Password is required';
                document.getElementById('passwordError').style.display = 'block';
                document.getElementById('password').classList.add('error-field');
                isValid = false;
            } else if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                document.getElementById('passwordError').style.display = 'block';
                document.getElementById('password').classList.add('error-field');
                isValid = false;
            }
            
            // Validate confirmPassword
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').style.display = 'block';
                document.getElementById('confirmPassword').classList.add('error-field');
                isValid = false;
            }
            
            if (isValid) {
    // Mock successful registration
    alert('Registration successful!');
    
    // Clear form
    document.getElementById('registrationForm').reset();
    
    // In a real application, you would send data to the server here
    console.log('Form data:', {
        username,
        firstName,
        lastName,
        email,
        password
    });
    
    // Redirect to login page
    window.location.href = 'login.html';
}
            }
        );
        
        // Fix login link
        document.getElementById('loginLink').addEventListener('click', function(e) {
    e.preventDefault();
    // Redirect to login page instead of showing alert
    window.location.href = 'login.html';
});
    </script>
</body>
</html>
