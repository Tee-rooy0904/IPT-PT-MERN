<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        h1, p {
            color: #333;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        p {
            margin-bottom: 30px;
            opacity: 0.9;
        }
        label {
            display: block;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffffff;
            color: #333;
            border: 1px solid #cccccc;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-size: 16px;
            box-sizing: border-box;
        }
        .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
        button {
            width: 100%;
            padding: 14px 0;
            border-radius: 40px;
            font-size: 18px;
            border: none;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .register-link {
            text-align: center;
            color: #333;
            font-weight: 500;
            margin-top: 20px;
        }
        .register-link a {
            color: #4facfe;
            margin-left: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        input.error-field {
            border: 1px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Login</h1>
        <p>Sign in to access your account</p>
        
        <form id="loginForm">
            <div>
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="Your username or email">
                <div id="usernameError" class="error">Username or email is required</div>
            </div>
            
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Your password">
                <div id="passwordError" class="error">Password is required</div>
            </div>
            
            <button type="submit" id="submitButton">Sign In</button>
            
            <div class="register-link">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset errors
            const errorElements = document.querySelectorAll('.error');
            errorElements.forEach(el => el.style.display = 'none');
            
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => input.classList.remove('error-field'));
            
            // Get form data
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            let isValid = true;
            
            // Validate username/email
            if (!username) {
                document.getElementById('usernameError').style.display = 'block';
                document.getElementById('username').classList.add('error-field');
                isValid = false;
            }
            
            // Validate password
            if (!password) {
                document.getElementById('passwordError').style.display = 'block';
                document.getElementById('password').classList.add('error-field');
                isValid = false;
            }
            
            if (isValid) {
                // Mock successful login
                alert('Login successful!');
                
                // Clear form
                document.getElementById('loginForm').reset();
                
                // In a real application, you would authenticate with the server here
                console.log('Login attempt:', {
                    username,
                    password
                });
            }
        });
    </script>
</body>
</html>
